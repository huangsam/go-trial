syntax = "proto3";

package proto;

option go_package = "./protobuf";

// Profile demonstrates common Protobuf data modeling features.
message Profile {
    int64 id = 1;
    string name = 2;
    bool active = 3;
    Status status = 4;
    Address address = 5;
    repeated string tags = 6;
    map<string, string> metadata = 7;

    // Only one contact option can be set at a time.
    oneof contact {
        string email = 8;
        string phone = 9;
    }

    // Presence distinguishes an unset score from an explicit zero.
    optional int32 score = 10;

    // The first enum value is the proto3 default.
    enum Status {
        STATUS_UNSPECIFIED = 0;
        STATUS_ACTIVE = 1;
        STATUS_INACTIVE = 2;
    }

    message Address {
        string street = 1;
        string city = 2;
    }
}
